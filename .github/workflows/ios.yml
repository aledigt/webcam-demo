name: iOS IPA (unsigned)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project WebcamDemo.xcodeproj -scheme WebcamDemo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/WebcamDemo.app Payload/
          zip -qry webcam-demo.ipa Payload
          ls -l webcam-demo.ipa
      - uses: actions/upload-artifact@v4
        with: { name: webcam-demo-ipa, path: webcam-demo.ipa }
      - name: Publish v2.0.0
        uses: softprops/action-gh-release@v2
        with: { tag_name: v2.0.0, make_latest: false, files: webcam-demo.ipa }
      - name: Publish latest
        uses: softprops/action-gh-release@v2
        with: { tag_name: latest, make_latest: true, files: webcam-demo.ipa }
