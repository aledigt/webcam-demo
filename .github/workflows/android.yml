name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../webcam-demo.apk
      - name: Verify signature
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          $AS verify --print-certs webcam-demo.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with: { name: webcam-demo-apk, path: webcam-demo.apk }
      - name: Publish v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Webcam Demo 2.0.0 (native)
          body: Native Android app (CameraX), release-signed. Built from ${{ github.sha }}.
          make_latest: false
          files: webcam-demo.apk
      - name: Publish latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Webcam Demo APK (latest)
          body: Latest release-signed native APK (v2.0.0+), built from ${{ github.sha }}.
          make_latest: true
          files: webcam-demo.apk
