name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bundle web app
        run: cp index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../webcam-demo.apk
      - uses: actions/upload-artifact@v4
        with: { name: webcam-demo-apk, path: webcam-demo.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Webcam Demo APK
          body: Debug-signed APK, built from ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: webcam-demo.apk
