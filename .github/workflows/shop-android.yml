name: eVision Shop APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shop-android/**'
      - '.github/workflows/shop-android.yml'
  push:
    branches:
      - main
      - cursor/evision-shop-apk-9b11
      - 'cursor/**'
    paths:
      - 'shop-android/**'
      - '.github/workflows/shop-android.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build debug APK
        working-directory: shop-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../evision-shop.apk
      - name: Verify APK
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs evision-shop.apk
          "$TOOLS/aapt" dump permissions evision-shop.apk
          "$TOOLS/aapt" dump badging evision-shop.apk | head -n 30
      - uses: actions/upload-artifact@v4
        with:
          name: evision-shop-apk
          path: evision-shop.apk
          if-no-files-found: error
