plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'io.github.aledigt.webcamdemo'
  compileSdk 34
  defaultConfig { applicationId 'io.github.aledigt.webcamdemo'; minSdk 24; targetSdk 34; versionCode 2; versionName '2.0.0' }
  signingConfigs {
    release {
      def ks = System.getenv('ANDROID_KEYSTORE_FILE')
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('ANDROID_STORE_PASSWORD')
        keyAlias System.getenv('ANDROID_KEY_ALIAS')
        keyPassword System.getenv('ANDROID_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
    }
  }
  buildFeatures { viewBinding true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
dependencies {
  def cx = '1.3.4'
  implementation "androidx.camera:camera-core:$cx"
  implementation "androidx.camera:camera-camera2:$cx"
  implementation "androidx.camera:camera-lifecycle:$cx"
  implementation "androidx.camera:camera-view:$cx"
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
  implementation 'com.google.android.material:material:1.12.0'
}
